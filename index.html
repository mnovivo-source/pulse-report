</div>
<details class="sec" data-k="open" ${OPEN.open ? "open" : ""}><summary><h2>Открытые сделки (${op.length}) — режим «немного рискованный»</h2></summary><p class="note">Режим сейчас: ${on(d.modes?.risk)}. Сделка ещё не закрыта: число справа — сколько было бы в плюсе или минусе, если закрыть прямо сейчас; оно меняется вместе с ценой. Стоп и тейк стоят на бирже. Сверху — самые прибыльные.</p><div class="list">${openC}</div></details>
<details class="sec" data-k="harv" ${OPEN.harv ? "open" : ""}><summary><h2>Сбор финансирования (${hv.length}) — режим «безрисковый»</h2></summary><p class="note">Режим сейчас: ${on(d.modes?.safe)}. Монета куплена на споте и столько же продано на фьючерсе: цена почти не влияет, доход — выплаты каждые 8 часов (03:00, 11:00, 19:00 МСК). Число справа — итог пары целиком: спот + шорт + полученные выплаты − комиссии входа; выплаты уже внутри него, отдельно они показаны строкой «Выплаты».</p><div class="list">${harvC}</div></details>
${coinsSec(d)}
<details class="sec" data-k="closed" ${OPEN.closed ? "open" : ""}><summary><h2>Закрытые сделки (${cl.length})</h2></summary><p class="note">Сверху — самые прибыльные, внизу — убыточные.</p><div class="list">${closedC}</div></details>
<details><summary>Как устроен бот</summary>
<p>Безрисковый режим — сбор финансирования: позиция рыночно-нейтральна, доход приносят выплаты, когда лонги переплачивают шортам. Расходы на вход и выход обеих частей ≈ 0,31%, поэтому позиции держатся днями.</p>
<p>Немного рискованный режим — сделки по правилам, которые сначала проверены на истории Bybit: подбор на одной части данных, проверка на другой. Основное правило — «перекос финансирования»: вход против переплачивающей стороны, удержание до 12 часов. Проверено на 38 монетах: на невиденном периоде (сентябрь–ноябрь) 115 сделок, в среднем +0,42% на сделку после комиссий.</p>
<p>«С поправкой на реальность» — демо-биржа исполняет сделки идеально: лимитка срабатывает, едва цена её коснулась, а стоп закрывается ровно по своей цене. На настоящем счёте так не бывает, поэтому бот с 08.11 ставит лимитку входа чуть глубже (вход засчитывается, только если цена прошла сквозь уровень сигнала — как в проверке на истории) и вычитает ≈0,05% из каждой сделки, закрытой по стопу. Это число ближе к тому, что дала бы настоящая торговля.</p>
<p>Общий баланс демо-счёта не показан: на нём лежат подаренные биржей монеты, и он колеблется с их ценой независимо от бота. Бот присылает свежие данные каждую минуту.</p>
</details>`;
}
let cur = JSON.parse(document.getElementById('initial').textContent);
render(cur);
async function pull() {
  for (const u of SRC) {
    try {
      const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', headers: u.includes('api.github.com') ? { Accept: 'application/vnd.github.raw' } : {} });
      if (!r.ok) continue;
      const d = await r.json();
      if (d && d.time && new Date(d.time) >= new Date(cur.time)) { cur = d; render(d); }
      return;
    } catch (e) {}
  }
}
async function live() {
  const urls = ['https://api.bybit.com/v5/market/tickers?category=linear', 'https://api.bytick.com/v5/market/tickers?category=linear'];
  for (const u of urls) { try { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) continue; const j = await r.json(); const L = {}; for (const x of j.result.list) L[x.symbol] = { p: +x.lastPrice, ps: x.lastPrice, ch: +x.price24hPcnt * 100 }; LIVE = L; liveAt = Date.now(); render(cur); return; } catch (e) {} }
}
pull(); live(); setInterval(pull, 60000); setInterval(live, 10000);
setInterval(() => render(cur), 60000);
</script>
