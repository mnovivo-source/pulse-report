${cs.length ? fold('coins', `Монеты «Маятника» и «Якоря» (${cs.length})`, `<p class="note">Открытый интерес 30м — насколько за полчаса выросло (+) или уменьшилось (−) число открытых позиций по монете. Финансирование — сколько покупатели (лонги) платят продавцам (шортам) за 8 часов; минус — наоборот.${liveAt ? ' Цены — прямо с биржи, обновлены ' + new Date(liveAt).toLocaleTimeString('ru-RU', {timeZone: 'Europe/Moscow'}) + '.' : ''}</p><div class="tw"><table><thead><tr><th>Монета</th><th>Цена</th><th>Изменение</th><th>Откр. интерес 30м</th><th>Финанс.</th><th>Пульс</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note" style="margin:10px 0 0"><b>Как читать «Пульс».</b> Оценка от −100 до +100: куда сейчас тянет монету. До ±30 — слабо, почти шум; ±30…60 — заметное давление; больше ±60 — сильное. Это подсказка, а не сигнал: бот входит в сделку только по проверенному правилу.</p>`) : ''}`;
    },
  };
  const tabBtn = ([k, nm]) => { const x = STR[k], s = sOf(k), v = k === 'sum' ? (S.length ? tot : null) : s ? s.pnl : null; return `<button type="button" class="tab${k === TAB ? ' on' : ''}${x ? ' r' + x.risk : ''}" data-tab="${k}">${x ? '<i></i>' : ''}<span>${esc(nm || x.name)}</span>${v != null ? `<small class="${cls(v)}">${m(v)}</small>` : ''}</button>`; };
  const nav = document.getElementById('tabs'), sl = nav ? nav.scrollLeft : 0;
  document.getElementById('app').innerHTML = `
<header><h1>Пульс — демо-торговля бота</h1>
<p class="lead">Демо-счёт Bybit, ненастоящие деньги. Время московское. Данные на ${t(d.time)}, бот работает с ${t(d.since)}. Страница обновляется сама.</p></header>
<nav id="tabs" class="tabs">${TABS.map(tabBtn).join('')}</nav>
${state}
<div class="tabbody">${(tabs[TAB] || tabs.sum)()}</div>`;
  const nav2 = document.getElementById('tabs'); if (nav2) nav2.scrollLeft = sl;
}
let cur = JSON.parse(document.getElementById('initial').textContent);
render(cur);
{ const nav = document.getElementById('tabs'), a = nav && nav.querySelector('.on'); if (a) nav.scrollLeft = a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2; }
async function pull() {
  for (const u of SRC) {
    try {
      const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', headers: u.includes('api.github.com') ? { Accept: 'application/vnd.github.raw' } : {} });
      if (!r.ok) continue;
      const d = await r.json();
      if (d && d.time && new Date(d.time) >= new Date(cur.time)) { cur = d; render(d); }
      return;
    } catch (e) {}
  }
}
async function live() {
  const urls = ['https://api.bybit.com/v5/market/tickers?category=linear', 'https://api.bytick.com/v5/market/tickers?category=linear'];
  for (const u of urls) { try { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) continue; const j = await r.json(); const L = {}; for (const x of j.result.list) L[x.symbol] = { p: +x.lastPrice, ps: x.lastPrice, ch: +x.price24hPcnt * 100 }; LIVE = L; liveAt = Date.now(); render(cur); return; } catch (e) {} }
}
pull(); live(); setInterval(pull, 60000); setInterval(live, 10000);
setInterval(() => render(cur), 60000);
</script>
