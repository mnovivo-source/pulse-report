  for (const u of SRC) {
    try {
      const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', headers: u.includes('api.github.com') ? { Accept: 'application/vnd.github.raw' } : {} });
      if (!r.ok) continue;
      const d = await r.json();
      if (d && d.time && new Date(d.time) >= new Date(cur.time)) { cur = d; render(d); }
      return;
    } catch (e) {}
  }
}
async function live() {
  const urls = ['https://api.bybit.com/v5/market/tickers?category=linear', 'https://api.bytick.com/v5/market/tickers?category=linear'];
  for (const u of urls) { try { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) continue; const j = await r.json(); const L = {}; for (const x of j.result.list) L[x.symbol] = { p: +x.lastPrice, ps: x.lastPrice, ch: +x.price24hPcnt * 100 }; LIVE = L; liveAt = Date.now(); render(cur); return; } catch (e) {} }
}
pull(); live(); setInterval(pull, 60000); setInterval(live, 10000);
setInterval(() => render(cur), 60000);
</script>
